<div class="shell">
  <app-sidebar [(mobileOpen)]="sidebarOpen" [alertCount]="alertCount()"></app-sidebar>

  <div class="shell-main">
    <header class="topbar">
      <button class="hamburger" (click)="sidebarOpen = !sidebarOpen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <span class="topbar-brand">{{ pageTitle() }}</span>

      <div class="topbar-actions">
        <a routerLink="/alerts" routerLinkActive="active" class="topbar-bell" title="Alertas">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M13.73 21a2 2 0 01-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          @if (alertCount() > 0) {
            <span class="topbar-bell-badge">{{ alertCount() }}</span>
          }
        </a>
        <a routerLink="/profile" routerLinkActive="active" class="topbar-avatar" title="Meu perfil">
          @if (profileService.profilePicSrc()) {
            <img [src]="profileService.profilePicSrc()!" alt="avatar" class="topbar-avatar-img" />
          } @else {
            {{ initials }}
          }
        </a>
      </div>
    </header>

    <router-outlet></router-outlet>
  </div>
</div>
