services:
  api:
    build:
      context: ./api/VitalSyncAPI
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=vitalsync;Username=${DB_USER};Password=${DB_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=vitalsync
      - Jwt__Audience=vitalsync
      - Jwt__ExpiresInMinutes=60
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service/VitalSyncAI
      dockerfile: Dockerfile
    environment:
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__User=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY}
      - Anthropic__InsightModel=${ANTHROPIC_INSIGHT_MODEL}
      - Anthropic__ReportModel=${ANTHROPIC_REPORT_MODEL}
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: vitalsync
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./front/vitalsync-front
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./front/vitalsync-front/src:/app/src
      - ./front/vitalsync-front/public:/app/public
      - ./front/vitalsync-front/proxy.conf.json:/app/proxy.conf.json
    depends_on:
      - api

volumes:
  pgdata:
  